[package]
name = "alastor-verifier"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Native RFC 8785 (JCS) + SHA-256 Proof of Error verifier and numerical discrepancy checker for ALASTOR Protocol."
repository = "https://alastor.tech"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
